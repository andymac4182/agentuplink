[workspace]
members = [
    "crates/tunnel-acp",
    "crates/tunnel-acp-export",
    "crates/tunnel-acp-fixture",
    "crates/tunnel-authority",
    "crates/tunnel-catalog",
    "crates/tunnel-client",
    "crates/tunnel-cluster",
    "crates/tunnel-core",
    "crates/tunnel-cua",
    "crates/tunnel-cua-export",
    "crates/tunnel-cua-fixture",
    "crates/tunnel-deadman",
    "crates/tunnel-fs-core",
    "crates/tunnel-fs-host",
    "crates/tunnel-fs-ninep",
    "crates/tunnel-fs-provider",
    "crates/tunnel-http-bridge",
    "crates/tunnel-http-forward",
    "crates/tunnel-mcp",
    "crates/tunnel-mcp-export",
    "crates/tunnel-mcp-fixture",
    "crates/tunnel-protocol",
    "crates/tunnel-relay",
    "crates/tunnel-test-harness",
    "crates/tunnel-transport",
]
resolver = "3"

# The advertised release commitment.  **This table is the single AUTHORITY for
# the word "advertised"**; before it existed, docs/tasks.md rows M6-01 and
# M6-C04 recorded at length that the word had none, so any claim to have built
# for "every advertised target" was a claim about a set the claimant chose.
#
# **"Single authority" does not mean "the only place the triples appear", and
# saying it did was itself a defect (M6-C18).**  Two consumers cannot read this
# table at the moment they need it -- `.github/workflows/release.yml`'s matrix
# is evaluated by GitHub before any script runs, and `site/releases.js` runs in
# a browser that has no access to this file.  Both therefore keep a literal
# copy, and both are **machine-compared to this table** by
# `scripts/m6-release-checks.py --check packaging`, which fails if either
# diverges.  A copy that is bound is a different thing from a copy that is
# unreconciled; `site/releases.js` was the second kind until M6-C18, and it is
# the one that decides what the public is actually offered.
#
# **The set is the one `.github/workflows/release.yml` already builds and
# `site/docs/downloads.html` already advertises, by owner decision (M6-C11):
# the release workflow is the authoritative packaging path, and this manifest
# was brought into agreement with it rather than the reverse.**  It is not a
# coincidence that `scripts/package_release.py` accepts exactly these four --
# that script reads this table and no longer carries its own tuple, and
# `scripts/m6-release-checks.py --check packaging` fails if the workflow's
# matrix and this list ever diverge.  `aarch64-unknown-linux-gnu` was briefly
# declared here and removed: nothing builds it, and declaring a target no
# packaging path produces was the defect rather than the fix.
#
# It lives here, in the root manifest, rather than in a dedicated file, for one
# reason that is a measurement rather than a preference: **a `[workspace.metadata]`
# table has two independent readers.**  `scripts/m6-release-artifact.py` and
# `scripts/m6-release-checks.py` parse this file with `tomllib` -- both already
# read it (`workspace_members()` and the lockfile beside it) -- and `cargo`
# itself surfaces the same table at `cargo metadata --no-deps --format-version 1`
# under `.metadata.release`, verified on this host to return this table's
# contents -- `{"release": {"advertised-targets": [...], "repository-visibility":
# "public"}}`, i.e. every key declared here, not `advertised-targets` alone, as
# an earlier version of this comment claimed (M6-C19).  A dedicated
# `release-targets.toml`
# would have exactly one reader, the script's own parser, so "what is declared"
# and "what the script parsed" would be the same act and a parser fault would be
# invisible.  `scripts/m6-release-artifact.py verify --check targets` requires
# both readers plus the set frozen into a bundle's `PROVENANCE.txt` to agree, so
# a divergence between the declaration and what the tooling uses goes red.
#
# Changing either value is a product decision, not a build detail: the target
# set determines what `deny.toml`'s `[graph] targets` may narrow to, what M6-03's
# platform matrix enumerates, and what M6-01 must ship a passing bundle for.
[workspace.metadata.release]
# `x86_64-pc-windows-msvc` is a client-only, locked-checks target (task row
# M1-04, owner decision 2026-09-25): its bundle ships `tunnel-client` and
# `tunnel-deadman` only, and the M1 real-socket acceptance runs on the Unix
# targets. The release tooling has no per-target role field, so this comment
# and docs/operator.md carry that statement.
advertised-targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
# **Built, verified and attested by CI, never published or advertised.**
# `aarch64-unknown-linux-gnu` is a client-only target (like Windows, it ships
# `tunnel-client` and `tunnel-deadman` only) that the CUA test VM needs.
# `.github/workflows/release.yml` builds it on `ubuntu-24.04-arm`, verifies
# the unpacked archive there and attests it, and `scripts/publish_release.py`
# publishes only `advertised-targets`, so it is a workflow artifact and never
# a release asset.  Promoting it to `advertised-targets` changes what the
# public is offered, which is the owner's decision (M6-C11); it is recorded
# on docs/tasks.md M6-C115.  `scripts/m6-release-checks.py --check packaging`
# requires the workflow matrix to equal the union of the two lists, and the
# two lists to be disjoint.
ci-only-targets = ["aarch64-unknown-linux-gnu"]
# The owner explicitly requested publication and the repository is public.
# `scripts/m6-release-checks.py --check visibility` compares GitHub's live
# answer against this declared expectation and fails on disagreement **in
# either direction**, so this is an assertion about reality rather than an
# inverted constant.  See AGENTS.md and docs/tasks.md row M6-C01.
repository-visibility = "public"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
tunnel-core = { path = "crates/tunnel-core" }

# h3-quinn 0.0.10 moves a pending Quinn receive stream into a reusable future
# and then unwraps it from stop_sending/recv_id.  The local patch preserves the
# upstream API while making idle-timeout cancellation stream-local and safe.
[patch.crates-io]
# h3 0.0.8 exposes validated remote GOAWAY to the bounded peer driver.
h3 = { path = "vendor/h3" }
h3-quinn = { path = "vendor/h3-quinn" }
quinn-proto = { path = "vendor/quinn-proto" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
