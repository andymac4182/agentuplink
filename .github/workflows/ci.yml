name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.95.0 fmt --all -- --check
      - name: Check lints
        run: cargo +1.95.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Populate the cargo registry cache for every target
        # `tunnel-cua/tests/host_untouched.rs` runs `cargo metadata --offline
        # --filter-platform` for Windows, Linux and Apple triples (M5-C04). A
        # build only downloads the host's packages, so without this the
        # Windows-only sources are missing on Linux/macOS runners and that
        # test fails -- by design, rather than skipping.
        run: cargo +1.95.0 fetch --locked
      - name: Run tests
        # `--no-fail-fast`: one failing test binary no longer hides every one
        # after it. The first hosted runs after the billing block each showed
        # only the first failure per OS, and the job still fails on any.
        #
        # Windows excludes tunnel-relay's own tests: the relay is not built
        # for Windows and refuses to start there (task row M6-C83). It still
        # compiles and passes clippy above, and its dependents' tests run.
        run: |
          set -euo pipefail
          # A plain string, not an array: macOS runs bash 3.2, where an empty
          # array under `set -u` is an unbound variable.
          exclude=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            exclude="--exclude tunnel-relay"
          fi
          # shellcheck disable=SC2086
          cargo +1.95.0 test --workspace --all-targets --locked --no-fail-fast $exclude
      - name: Validate example configurations
        run: |
          set -euo pipefail
          cargo +1.95.0 run --locked -p tunnel-client -- config check --config examples/m1-client.toml
          cargo +1.95.0 run --locked -p tunnel-client -- check-config examples/client.toml
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # The relay refuses to start off Unix (task row M6-C83); the
            # relay examples are validated on the Linux and macOS jobs.
            exit 0
          fi
          cargo +1.95.0 run --locked -p tunnel-relay -- check-config examples/relay.toml
          # Dry-run every runnable serving example with the ServeConfig that
          # `serve --config` itself constructs. The legacy `check-config` above
          # parses a different type and cannot validate a serving document, so
          # without this step an example that fails relay startup ships green.
          # `serving_examples_are_exactly_the_files_the_ci_dry_run_glob_expands`
          # in crates/tunnel-relay/tests/example_configs.rs keeps this glob and
          # the classified serving examples in step.
          shopt -s nullglob
          serving_examples=(examples/*-relay.toml)
          if [ "${#serving_examples[@]}" -eq 0 ]; then
            echo "no examples/*-relay.toml serving example found; the dry run would validate nothing" >&2
            exit 1
          fi
          for example in "${serving_examples[@]}"; do
            echo "Dry-running serving configuration ${example}"
            cargo +1.95.0 run --locked -p tunnel-relay -- check-serve-config --config "${example}"
          done

  release-checks:
    name: M6-04 dependency, licence and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # **`fetch-depth: 0` is load-bearing, not tidiness.** The secret scan
          # walks every blob reachable from every ref. Under the default
          # shallow checkout `git rev-list --objects --all` returns one
          # commit's objects, so the scan would report zero findings over
          # almost nothing and look exactly like a clean history. The script's
          # own blob floor fails the job in that case rather than passing, but
          # the floor is the backstop; this is the fix.
          fetch-depth: 0
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install cargo-deny 0.19.6
        # Pinned, and `--locked`: the deny.toml schema was read out of this
        # exact version's own `init` template. The script asserts the version
        # and fails rather than running an unknown one, because a renamed
        # config key that is silently ignored would make the policy pass over
        # nothing.
        run: cargo +1.95.0 install --locked cargo-deny@0.19.6
      - name: Populate the cargo registry cache
        # **Load-bearing, and its absence made this job known-broken rather
        # than merely unexercised.** The checks invoke cargo-deny with
        # `--offline` by default. On a fresh runner CARGO_HOME is empty, so
        # `cargo metadata` fails with "no matching package", cargo-deny emits
        # no summary record, and `deps` fails. `fetch` also extracts the crate
        # sources cargo-deny reads LICENSE text from when it resolves a
        # licence by file rather than by manifest field, so this covers both
        # needs. Alternatively pass `--no-offline` to the script.
        run: cargo +1.95.0 fetch --locked
      - name: Prove the checks can still fail
        # **Runs before the checks themselves, deliberately.** Each control
        # plants a synthetic case and requires the corresponding check to go
        # red. A green gate whose controls were never run is the defect class
        # docs/tasks.md row M5-C11 tracks; running them first means a broken
        # scanner fails the job instead of quietly passing it.
        run: python3 scripts/m6-release-checks.py --self-test
      - name: Dependency, licence, provenance, secret and visibility checks
        env:
          # `GET /repos/{owner}/{repo}` needs only `metadata: read`, which the
          # automatic `github.token` always carries, so the visibility check
          # runs here rather than being skipped.
          #
          # **It was skipped, and the stated reason was wrong.** The comment
          # claimed the check needed a token the job did not have. The effect
          # was worse than the inaccuracy: visibility is the gate's only
          # currently-red check, so omitting it made the automated form of the
          # gate go green on a repository that fails the gate -- an automation
          # that cannot report the one problem it exists to catch.
          #
          # This job is therefore expected to FAIL while the repository is
          # public (docs/tasks.md M6-C01). That is the correct behaviour and
          # must not be "fixed" by dropping the check again; it goes green when
          # the owner restores privacy.
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/m6-release-checks.py

  m1-acceptance:
    name: M1 real-socket acceptance (Redis)
    runs-on: ubuntu-latest
    # The M6-C65 restart gate adds a test build and about five minutes.
    timeout-minutes: 40
    services:
      redis:
        image: redis:8.4.0-alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
          --memory 256m
    env:
      RUST_LOG: info
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      TUNNEL_CATALOG_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build runnable workspace binaries
        run: cargo +1.95.0 build --workspace --bins --locked
      - name: Test authoritative Redis catalog
        run: cargo +1.95.0 test -p tunnel-catalog --test redis_catalog --locked -- --ignored
      - name: Verify production relay, client, authorization and transport failures
        run: cargo +1.95.0 run --locked -p tunnel-test-harness -- verify
      - name: Verify Redis AOF restart and explicit recovery
        run: bash scripts/m1-redis-restart-verify.sh
      # M6-C65: owns its own Redis container, like the step above; the
      # service Redis is not used.
      - name: Verify a single relay keeps its namespace across Redis restarts
        run: sh scripts/m6-redis-restart-verify.sh

  # M1-04: the M1 real-socket acceptance on the second advertised CI operating
  # system.  macOS runners have no service containers and no Docker, so Redis
  # comes from Homebrew and is started here, and the two restart gates above --
  # which own their own Docker containers -- are Linux-only by construction.
  # Windows has no M1 acceptance lane at all: the relay refuses to start off
  # Unix (M6-C83) and credential creation/import is unsupported there, which
  # docs/tasks.md M1-04 records as an owner decision rather than a skip.
  m1-acceptance-macos:
    name: M1 real-socket acceptance (macOS, Redis)
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      RUST_LOG: info
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      TUNNEL_CATALOG_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Start Redis
        run: |
          set -euo pipefail
          brew install redis
          redis-server --version
          redis-server --port 6379 --bind 127.0.0.1 --save '' --appendonly no --daemonize yes
          for _ in $(seq 1 50); do
            if redis-cli -p 6379 ping | grep -q PONG; then exit 0; fi
            sleep 0.2
          done
          echo "Redis did not answer PING" >&2
          exit 1
      - name: Build runnable workspace binaries
        run: cargo +1.95.0 build --workspace --bins --locked
      - name: Test authoritative Redis catalog
        run: cargo +1.95.0 test -p tunnel-catalog --test redis_catalog --locked -- --ignored
      - name: Verify production relay, client, authorization and transport failures
        run: cargo +1.95.0 run --locked -p tunnel-test-harness -- verify

  m2-acceptance:
    name: M2 rotation and recovery (Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:8.4.0-alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
          --memory 256m
    env:
      RUST_LOG: info
      TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Verify accelerated rotations and transport faults
        run: sh scripts/m2-harness-verify.sh accelerated
      - name: Verify three rotations at the actual 300-second interval
        run: sh scripts/m2-harness-verify.sh default

  m7-acceptance:
    name: M7 integration and Redis acceptance (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:8.4.0-alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
          --memory 256m
    env:
      RUST_LOG: info
      TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run M7 harness and Redis acceptance gates
        run: sh scripts/m7-harness-verify.sh

  # M3: the MCP and http-forward/1 gates over the three-relay cluster fixture,
  # plus the stdio export's process-tree residue measurements.  The real-path
  # gate's OPEN-journal rules are M3-31's (docs/tasks.md): the earlier
  # phases' entries must be reclaimed before the sequential baseline, the
  # journal must return to that baseline, and its peak stays within a sixteenth
  # of the journal cap.
  #
  # **No artifacts and no process-log directories, on purpose (M7-C112).**
  # The harness's preserved child captures carry the fixture's Redis TLS client
  # key and OIDC tokens; synthetic or not, a public repository must not publish
  # them.  The job log carries the gates' own payload-free evidence lines.
  m3-acceptance:
    name: M3 MCP and http-forward acceptance (Linux, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:8.4.0-alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
          --memory 256m
    env:
      # `rmcp`, the MCP SDK the cloud-client gate drives as its consumer, logs
      # every notification it receives in full at `info`, which printed the
      # fixture's synthetic stream payloads into this public job log (M0-09).
      RUST_LOG: info,rmcp=warn
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      TUNNEL_CATALOG_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run M3 harness gates
        run: sh scripts/m3-harness-verify.sh
      # M3-17: the official MCP TypeScript and Python SDKs and the official
      # conformance suite, each pinned by lockfile or hash in
      # tests/mcp-sdk-conformance, through real local relays.  The binaries
      # are the ones the step above built; the job's plaintext Redis is
      # fronted with TLS by the script itself.  It prints payload-free case
      # lines only and publishes nothing.
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Off-the-shelf MCP SDKs and conformance suite through the relay
        run: sh scripts/m3-sdk-conformance.sh
      # M3-39/M3-40: the demo recipe (docs/demo/mcp.md), both profiles,
      # through a real local relay.  The job's plaintext Redis is fronted with
      # TLS by the script (DEMO_PLAIN_REDIS); its keys are purged on exit.  A
      # run passes only on the client's own final `mcp-demo: ok` line.
      - name: MCP demo (both profiles) through a local relay
        run: |
          set -eu
          for profile in mcp-2025-11-25 mcp-2026-07-28; do
            DEMO_PLAIN_REDIS=127.0.0.1:6379 DEMO_PROFILE="$profile" sh scripts/demo-mcp.sh > demo.log 2>&1 \
              || { tail -40 demo.log; exit 1; }
            grep '^mcp-demo: ' demo.log
            grep -q "^mcp-demo: ok profile=${profile#mcp-} " demo.log \
              || { echo "no mcp-demo ok line for $profile"; exit 1; }
          done

  # M4: the filesystem gates 4 to 14 over the three-relay cluster fixture,
  # including gate 11 (a 9P session across a failed data socket's retained
  # recovery) and gate 6, which drives the shared TypeScript client.
  #
  # **No artifacts and no process-log directories, on purpose (M7-C112).**
  # The harness's preserved child captures carry the fixture's Redis TLS client
  # key and OIDC tokens; synthetic or not, a public repository must not publish
  # them.  The job log carries the gates' own payload-free evidence lines.
  m4-acceptance:
    name: M4 filesystem harness gates (Linux, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:8.4.0-alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
          --memory 256m
    env:
      RUST_LOG: info
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      TUNNEL_CATALOG_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      # Gate 6 runs the shared TypeScript client's own sources under node,
      # which needs native type stripping (packages/client: node >= 24). The
      # gate imports no npm package, so there is no install step.
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run M4 filesystem harness gates
        run: sh scripts/m4-harness-verify.sh
      # Task row M4-08's last gap: a real mount inside an export on Linux,
      # where the boundary is `openat2`'s RESOLVE_NO_XDEV. The runner's sudo
      # mounts a tmpfs; the test itself takes no privilege. It runs twice:
      # against the mounted export (must pass, 1 test) and against an export
      # with no mount (must fail on its own positive control), so a pass
      # cannot be a test that did not look.
      - name: Linux mount-point refusal (M4-08)
        run: |
          set -euo pipefail
          base=$(mktemp -d)
          trap 'sudo umount "$base/export/mnt" 2>/dev/null || true' EXIT
          mkdir -p "$base/export/mnt" "$base/export/plain" "$base/unmounted/mnt" "$base/unmounted/plain"
          echo synthetic > "$base/export/plain/beside.txt"
          echo synthetic > "$base/unmounted/plain/beside.txt"
          echo synthetic > "$base/unmounted/mnt/inside.txt"
          sudo mount -t tmpfs -o size=1m tmpfs "$base/export/mnt"
          echo synthetic | sudo tee "$base/export/mnt/inside.txt" > /dev/null
          sudo chmod 0755 "$base/export/mnt"
          sudo chmod 0644 "$base/export/mnt/inside.txt"
          test_cmd() {
            TUNNEL_FS_LINUX_MOUNT_EXPORT="$1" cargo +1.95.0 test -p tunnel-fs-host --locked \
              --test special_and_mounts -- --ignored --exact \
              a_mount_point_inside_the_export_is_not_crossed_on_linux --nocapture
          }
          test_cmd "$base/export" > "$base/mounted.log" 2>&1 || { cat "$base/mounted.log"; exit 1; }
          cat "$base/mounted.log"
          grep -q "test result: ok. 1 passed" "$base/mounted.log"
          grep -q "m4-08-linux-mount ok" "$base/mounted.log"
          if test_cmd "$base/unmounted" > "$base/unmounted.log" 2>&1; then
            cat "$base/unmounted.log"; echo "the control without a mount passed"; exit 1
          fi
          grep -q "mnt must be a mount point on another device" "$base/unmounted.log"
          echo "control without a mount failed on its own positive control, as it must"
      # Task row M4-54: the filesystem demo (docs/demo/filesystem.md) end to
      # end -- shipped relay and client, a real shared-client, just-bash,
      # Mastra and Files SDK consumer, live revocation -- in front of this
      # job's Redis through the demo's own TLS terminator.
      - name: Filesystem demo (M4-54)
        run: |
          set -euo pipefail
          (cd packages/client && npm ci)
          log=$(mktemp)
          DEMO_PLAINTEXT_REDIS=127.0.0.1:6379 bash scripts/fs-demo.sh > "$log" 2>&1 || { cat "$log"; exit 1; }
          cat "$log"
          grep -q "^fs-demo: PASS" "$log"
          grep -q "^cleanup: deleted [1-9][0-9]* keys of namespace" "$log"

  # M0-08: the cross-milestone payload scan (docs/tasks.md M0-04, M0-08,
  # M0-09).  It re-runs the M1, M2, M3, M4 and M8 gates listed in
  # scripts/m0-payload-scan.py with a private capture directory each, so every
  # fixture records the exact synthetic credentials, application payloads,
  # paths and endpoints it used, and scans every captured stream -- the gate's
  # own stdout and stderr (where the in-process relays' and clients' tracing
  # lands), each managed process's streams and each typed snapshot -- for them
  # and for fixed credential shapes.  It fails on any hit, on a gate whose
  # domain is empty (no sentinel of a declared kind, fewer managed streams or
  # snapshots than the gate writes, no DEBUG relay event, no text payload),
  # and on any of its 21 planted controls -- one per gate -- that does not go
  # red with its declared witness.  It runs as its own job, beside the milestone jobs rather than
  # inside them, so it adds no time to their critical path and M8's gates run
  # in hosted CI at all.
  #
  # **No artifacts, on purpose (M7-C112).**  The captures hold the fixture's
  # synthetic keys and tokens; the script prints only counts, categories,
  # stream roles and offsets, and deletes its captures on exit.
  m0-payload-scan:
    name: M0 cross-milestone payload scan (Linux, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:8.4.0-alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
          --memory 256m
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      TUNNEL_CATALOG_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      # verify-m4-fs-client-e2e runs the shared TypeScript client's sources
      # under node, as in the M4 job.
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Scanner unit probes
        run: python3 scripts/m0-payload-scan.py --unit
      - name: Build runnable workspace binaries
        run: cargo +1.95.0 build --workspace --bins --locked
      - name: Scan the M1, M2, M3, M4 and M8 gates, with 21 planted witnesses, one per gate
        run: python3 scripts/m0-payload-scan.py
