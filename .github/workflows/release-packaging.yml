name: Release packaging tests
# `test_package_release.py` packs this repository's real documents and
# examples and checks the archive's top level against the verifier's
# (docs/tasks.md M6-C216), so any shipped document or example can change the
# result: the guide's links decide which documents ship, and every shipped
# document's text decides which examples do.  `docs/**`, not `docs/*.md`:
# GitHub's `*` does not match `/`.  `LICENSE` because `package()` copies it.
on:
  push:
    paths: ['scripts/*release*.py', '.github/workflows/release*.yml', 'docs/**', 'examples/**', 'Cargo.toml', 'LICENSE']
  pull_request:
    paths: ['scripts/*release*.py', '.github/workflows/release*.yml', 'docs/**', 'examples/**', 'Cargo.toml', 'LICENSE']
permissions:
  contents: read
jobs:
  packaging:
    # Every host OS a release archive is packed on: the archives now carry
    # documents whose paths and bytes must not depend on the packing host
    # (docs/tasks.md M6-C50), and the Windows zip is packed on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/test_package_release.py
      - run: python3 scripts/test_release_artifact_cli.py
      - run: python3 scripts/test_verify_release_archive.py
