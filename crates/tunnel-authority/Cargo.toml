[package]
name = "tunnel-authority"
description = "Operator authority for membership, checkpoints and offline recovery approvals"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tunnel-catalog = { path = "../tunnel-catalog" }
zeroize = "1.8"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.52.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml.workspace = true
tunnel-cluster = { path = "../tunnel-cluster" }
tunnel-transport = { path = "../tunnel-transport" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
tempfile = "3.21"
tokio = { version = "1.52.1", features = ["macros", "process", "rt-multi-thread", "test-util", "time"] }
tunnel-relay = { path = "../tunnel-relay" }
uuid = { version = "1.24.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
