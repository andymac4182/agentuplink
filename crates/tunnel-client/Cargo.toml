[package]
name = "tunnel-client"
description = "Mutually authenticated outbound agent tunnel CLI and client runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tunnel-core.workspace = true
tunnel-protocol = { path = "../tunnel-protocol" }
tunnel-http-bridge = { path = "../tunnel-http-bridge" }
tunnel-acp-export = { path = "../tunnel-acp-export" }
# The doctor reports whether the parent-death sentinel executable is installed
# (M3-09); without it, supervised process groups leak on every crash.
tunnel-deadman = { path = "../tunnel-deadman" }
tunnel-mcp-export = { path = "../tunnel-mcp-export" }
# M5 Lane B: a `computer.v1` export driving a real CUA backend. Optional, and
# only behind the non-default `cua` feature; a build with it still serves a
# CUA export only when `AGENT_TUNNEL_CUA_LANE_B=1` is set. None of the three
# links anything capable of input or capture (`tunnel-cua/tests/host_untouched.rs`);
# the capability lives in the supervised backend process, which must run on a
# dedicated, disposable machine.
tunnel-cua = { path = "../tunnel-cua", optional = true }
tunnel-cua-export = { path = "../tunnel-cua-export", optional = true }
tunnel-cua-fixture = { path = "../tunnel-cua-fixture", optional = true }
bytes = "1"
http = "1"
http-body-util = "0.1"
tunnel-transport = { path = "../tunnel-transport" }
# M6-C25: `credentials import` reads the certificate version itself, so a v1
# certificate is reported as one instead of as a key mismatch.
x509-parser = "0.17.0"
futures-util = { version = "0.3.31", features = ["sink", "std"] }
rcgen = "0.13"
rustls = { version = "0.23.38", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
serde.workspace = true
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml.workspace = true
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
# M0-07 review: wipe the pinned private-key bytes on drop (already locked,
# a transitive dependency of rustls-pki-types and others).
zeroize = "1.8"
# M4 gate 4: the device half of the filesystem endpoint.
tunnel-fs-core = { path = "../tunnel-fs-core" }
tunnel-fs-ninep = { path = "../tunnel-fs-ninep" }
tunnel-fs-provider = { path = "../tunnel-fs-provider" }

# The resolver is Unix-only, for the reason gate 2 records: filesystem
# exports are declared unsupported on Windows, where `tunnel-fs-host`
# compiles to that declaration alone and this connector serves no session.
[target.'cfg(unix)'.dependencies]
tunnel-fs-host = { path = "../tunnel-fs-host" }
# M6-06: the supervisor IPC compares a peer's UID with this process's
# effective UID; `rustix::process::geteuid` is the safe call (the crate is
# already locked, as a dev-dependency below).
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
# M6-C194: a real relay listener at its connection limit, in a unit test of
# the upgrade's `CONNECTION_LIMIT` classification (already locked).
axum = { version = "0.8.9", default-features = false }
tempfile = "3.21"
# Paused-time tests of the connect-status rate bound (M7-C167 review).
tokio = { version = "1.47", features = ["test-util"] }
# M6-C25: signs a genuine X.509 v1 certificate at test time; no v1 generator
# in the tree can, and no key material is committed.
ring = "0.17.14"
# M4-71: an in-crate test builds an http-forward/1 profile to admit an OPEN.
tunnel-http-forward = { path = "../tunnel-http-forward" }

# `reconnect_cli.rs` resets a connection mid-handshake (`SO_LINGER` 0).
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", default-features = false, features = ["net", "std"] }

[features]
default = []
# M5 Lane B (see the optional dependencies above). Non-default on purpose.
cua = ["dep:tunnel-cua", "dep:tunnel-cua-export", "dep:tunnel-cua-fixture"]
# M6-06: rotation holds for the shutdown-phase gate only
# (`src/rotation_hooks.rs`); never enabled in a shipped build.
test-hooks = []

[lints]
workspace = true
