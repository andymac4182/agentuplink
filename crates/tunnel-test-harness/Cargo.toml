[package]
name = "tunnel-test-harness"
description = "Reusable fixtures and real-socket harness for Agent Tunnel acceptance tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The binary's entry point is `src/entry.rs`, so the acceptance command in
# `src/main.rs` can be a Unix-only module; see that file.
autobins = false

[[bin]]
name = "tunnel-test-harness"
path = "src/entry.rs"

[dependencies]
axum = "0.8.9"
async-trait = "0.1.89"
bytes = "1"
http = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
http-body-util = "0.1"
# `http2` for the ACP consumer: `acp-http-v1` is an HTTP/2-only profile
# (M8-01), so the M8-04 gate's consumer cannot use the HTTP/1.1 client the
# other http-forward gates share.
hyper = { version = "1.7", features = ["http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
rcgen = "0.13"
# The M3-03 gate's cloud-side client is the pinned official Rust MCP SDK
# (docs/mcp.md, "Pinned in code").
rmcp = { version = "=3.4.0", default-features = false, features = [
    "client",
    "transport-streamable-http-client-unix-socket",
] }
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }
sse-stream = "0.2"
rsa = { version = "0.9", features = ["pem"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde.workspace = true
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.13"
time = "0.3"
tokio = { version = "1.40", features = ["full"] }
redis = { version = "1.7.0", default-features = false, features = [
    "tokio-comp",
    "script",
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
tunnel-acp = { path = "../tunnel-acp" }
tunnel-acp-export = { path = "../tunnel-acp-export" }
tunnel-acp-fixture = { path = "../tunnel-acp-fixture" }
tunnel-catalog = { path = "../tunnel-catalog" }
tunnel-cluster = { path = "../tunnel-cluster" }
tunnel-client = { path = "../tunnel-client" }
# The M4 gate-4 gate speaks 9P2000.L on the wire itself, because the contract's
# first certified consumer runtime is Node and there is no Rust client to reuse.
tunnel-fs-core = { path = "../tunnel-fs-core" }
tunnel-fs-ninep = { path = "../tunnel-fs-ninep" }
tunnel-http-bridge = { path = "../tunnel-http-bridge" }
tunnel-http-forward = { path = "../tunnel-http-forward" }
tunnel-mcp = { path = "../tunnel-mcp" }
tunnel-mcp-export = { path = "../tunnel-mcp-export" }
tunnel-mcp-fixture = { path = "../tunnel-mcp-fixture" }
tunnel-core = { path = "../tunnel-core" }
tokio-util = { version = "0.7", features = ["rt"] }
tunnel-relay = { path = "../tunnel-relay" }
tunnel-transport = { path = "../tunnel-transport" }
tunnel-protocol = { path = "../tunnel-protocol" }
futures-util = { version = "0.3", features = ["sink", "std"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
# `#[tokio::test(start_paused = true)]` in this crate's own tests; workspace
# feature unification otherwise hid it from `cargo test -p`.
tokio = { version = "1.40", features = ["test-util"] }

[lints]
workspace = true
