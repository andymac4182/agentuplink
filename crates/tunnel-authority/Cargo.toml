[package]
name = "tunnel-authority"
description = "Operator authority tools that keep publisher and approval signing keys off every relay host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tunnel-authority"
path = "src/main.rs"

# The signing tools are Unix-only (task row M6-C22): the private key file is
# refused unless it is mode 0600 in a 0700 directory, and Windows has no such
# mode. On Windows the binary compiles and refuses every command.
[target.'cfg(unix)'.dependencies]
chrono = { version = "0.4", features = ["clock"] }
libc = "0.2"
ring = "0.17.14"
serde.workspace = true
serde_json = "1.0"
sha2 = "0.10"
tunnel-catalog = { path = "../tunnel-catalog" }

[target.'cfg(unix)'.dev-dependencies]
rcgen = "0.13"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tunnel-transport = { path = "../tunnel-transport" }
uuid = { version = "1.18", features = ["v4"] }

[lints]
workspace = true
