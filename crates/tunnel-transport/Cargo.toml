[package]
name = "tunnel-transport"
description = "TLS, HTTP/1-2 and bounded HTTP/3 transport foundations for Agent Tunnel"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "ws"] }
bytes = "1.10.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.3.1"
hyper = { version = "1.8.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "service", "tokio"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = { version = "1.14.0", features = ["std"] }
sha2 = "0.10.9"
socket2 = "0.6.5"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing = "0.1.41"
x509-parser = "0.17.0"

[target.'cfg(unix)'.dependencies]
# Errno classification of `accept` errors (M6-C155); no unsafe code.
rustix = { version = "1.1", default-features = false, features = ["std"] }

[dev-dependencies]
# HTTP/2 client, streamed bodies and body collection for the M6-C193
# turnover tests; all already in Cargo.lock.
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.8.1", features = ["client", "http1", "http2", "server"] }
rcgen = "0.13"
# Races between a peer driver and a concurrent shutdown only exist when two
# tasks can poll at once (M7-C105).
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }

[target.'cfg(unix)'.dev-dependencies]
# Lowers the soft descriptor limit in the M6-C155 accept-error test.
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
