name: Main development release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A pull request that changes the release path builds and verifies the
  # complete matrix exactly as main does, and never attests or publishes:
  # `attest` and `publish` run only for `workflow_run` (docs/tasks.md M6-C13,
  # M6-C114).  Fork pull requests are skipped.
  pull_request:
    paths:
      - 'scripts/*release*.py'
      - '.github/workflows/release.yml'
      - 'docs/operator.md'
      - 'docs/join-relay.md'
      - 'examples/**'
      - '.cargo/config.toml'
      - 'Cargo.lock'
      - 'crates/tunnel-client/src/main.rs'
      - 'crates/tunnel-relay/src/main.rs'
      - 'crates/tunnel-deadman/src/**'
      - 'crates/tunnel-authority/src/**'
      - 'crates/tunnel-authority/Cargo.toml'

permissions:
  contents: read

concurrency:
  group: main-release-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The commit and run a release is named after.  For a pull request these
  # are the merge commit the run checked out and this run, so its archives
  # are named `...-main.<run>.<sha>` like a release's but name a commit that
  # is not on main; they are workflow artifacts, never release assets.
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  SOURCE_RUN: ${{ github.event.workflow_run.id || github.run_id }}

jobs:
  build:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          # CI-only (Cargo.toml `ci-only-targets`, M6-C115): client-only,
          # built, verified and attested here, never published.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          # The arm Linux image may not carry rustup. If it is absent, install
          # a pinned rustup-init, checked against a recorded SHA-256, rather
          # than piping an unpinned installer script into a shell.
          if ! command -v rustup > /dev/null; then
            test "${{ matrix.target }}" = aarch64-unknown-linux-gnu
            curl --proto '=https' --tlsv1.2 -sSfo rustup-init \
              https://static.rust-lang.org/rustup/archive/1.29.1/aarch64-unknown-linux-gnu/rustup-init
            echo "15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433  rustup-init" | sha256sum -c -
            chmod +x rustup-init
            ./rustup-init -y --profile minimal --default-toolchain none
            rm rustup-init
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.95.0 --profile minimal --target "${{ matrix.target }}"
      - name: Test packaging
        run: python3 scripts/test_package_release.py
      - name: Fetch locked dependencies and licence sources
        run: cargo +1.95.0 fetch --locked
      - name: Build release binaries
        # The relay and tunnel-authority (M6-C22) are not built for
        # device-half targets: Windows (task row M6-C83 -- the relay has never
        # run there and refuses to start) and every CI-only target (M6-C115). The set comes from
        # scripts/package_release.py's `binaries_for`, which also decides
        # what is packed, so the two cannot disagree.
        run: |
          set -euo pipefail
          # Any RUSTFLAGS-style variable REPLACES `.cargo/config.toml`'s
          # rustflags, which would silently drop the Windows static C runtime
          # (M6-C116). Release builds must take their flags from the config.
          for name in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTFLAGS; do
            if [[ -n "${!name:-}" ]]; then
              echo "::error::$name is set; release builds must take rustflags from .cargo/config.toml"
              exit 1
            fi
          done
          packages=()
          for binary in $(python3 -c 'import sys; sys.path.insert(0, "scripts"); from package_release import binaries_for; print(" ".join(binaries_for(sys.argv[1])))' "${{ matrix.target }}"); do
            packages+=(-p "$binary")
          done
          cargo +1.95.0 build --release --locked --target "${{ matrix.target }}" "${packages[@]}" --bins
      # There is deliberately no smoke test of `target/` here any more: the
      # `verify` job below runs every probe it ran, and more, against the
      # unpacked archive on a runner that never built it (M6-C13).
      - name: Package and checksum
        run: python3 scripts/package_release.py --target "${{ matrix.target }}" --sha "$SOURCE_SHA" --run "$SOURCE_RUN" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # The gate checks, run against the UNPACKED archive on a fresh hosted
  # runner of the target's own OS and architecture -- not the runner that
  # built it, and never from `target/` (docs/tasks.md M6-C13, applied by
  # default pending owner confirmation, 2026-09-25).  The runner labels are
  # the current `-latest` images, a newer image than the pinned build hosts,
  # so a binary that only runs where it was built fails here.  The script
  # refuses to pass on a host whose OS or architecture differs from the
  # target's, so a label that moves to another architecture goes red rather
  # than silently verifying nothing natively.  `x86_64-apple-darwin` has no
  # `-latest` Intel label; `macos-15-intel` is the Intel image, and
  # `ubuntu-24.04-arm` is the arm Linux image.  Windows (M6-C83) and the
  # CI-only arm Linux target (M6-C115) are client-only device halves.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # Only the verifier and what it imports; nothing is installed or built
      # here. The runner image has its own Rust toolchain, so the guarantee
      # is narrower than "no cargo on the machine": every probe runs with a
      # PATH of system directories only, and the verifier's `cli` check
      # proves `cargo` is unreachable on that PATH before any probe runs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            Cargo.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist
      - name: Verify the unpacked archive natively, with planted-defect controls
        run: |
          set -euo pipefail
          archive=$(find dist -maxdepth 1 -name "agentuplink-*-${{ matrix.target }}.*" ! -name '*.sha256')
          test "$(printf '%s\n' "$archive" | wc -l)" -eq 1
          python3 scripts/verify_release_archive.py --archive "$archive" --target "${{ matrix.target }}" \
            --sha "$SOURCE_SHA" --run "$SOURCE_RUN" --self-test

  # GitHub build-provenance attestation for every archive and checksum file,
  # after every target has verified (demo-readiness defect D8).  It binds each
  # file's SHA-256 to this repository, this workflow file, the ref and commit
  # the run executed on, and the run, signed through Sigstore.  It runs only
  # on the main release path, so a pull-request build is never attested and
  # the documented `--source-ref refs/heads/main` check admits release builds
  # only.  A `workflow_run` job executes on main's tip at the time the release
  # runs, which may be later than the commit it built (`sourceSha` in
  # release.json); release.json is the source identity.  It is not code
  # signing: macOS Gatekeeper and Windows SmartScreen still treat the binaries
  # as unsigned.
  attest:
    needs: verify
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
      # Prove the published command works on every file before anything is
      # published, and that it is bound to this workflow file.
      - name: Verify each attestation the way a tester will
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          for file in dist/*; do
            gh attestation verify "$file" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main > /dev/null
            echo "attestation verified: $(basename "$file")"
            count=$((count + 1))
          done
          # publish_release.py separately refuses an incomplete matrix; this
          # only refuses a run that verified nothing.
          test "$count" -ge 2

  publish:
    needs: attest
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish complete development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_release.py --sha "$SOURCE_SHA" --run "$SOURCE_RUN" --directory dist
