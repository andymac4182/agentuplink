[package]
name = "tunnel-relay"
description = "Axum relay for the authenticated multi-user agent tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tower = "0.5"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
bytes = "1"
http = "1"
http-body = "1"
chrono = { version = "0.4", features = ["clock"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
libc = "0.2"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
tunnel-core.workspace = true
tunnel-catalog = { path = "../tunnel-catalog" }
tunnel-cluster = { path = "../tunnel-cluster" }
tunnel-http-bridge = { path = "../tunnel-http-bridge" }
tunnel-acp = { path = "../tunnel-acp" }
# M5: the `computer-v1` profile tables (pure; no screen or input dependency).
tunnel-cua = { path = "../tunnel-cua" }
tunnel-http-forward = { path = "../tunnel-http-forward" }
tunnel-mcp = { path = "../tunnel-mcp" }
tunnel-protocol = { path = "../tunnel-protocol" }
tunnel-transport = { path = "../tunnel-transport" }
serde.workspace = true
toml.workspace = true
# Gate 4 needs the shared filesystem vocabulary at the relay: the descriptor
# and its capability model (gate 1), the consumer WebSocket decode rule (gate
# 3), and the device-to-relay record framing that carries a close code.
tunnel-fs-core = { path = "../tunnel-fs-core" }
tunnel-fs-ninep = { path = "../tunnel-fs-ninep" }
tunnel-fs-provider = { path = "../tunnel-fs-provider" }

# File identity (volume serial number and file index) for the private state
# files, read from a handle without unsafe code; already in Cargo.lock through
# `same-file`. See `src/file_identity.rs` and task row M6-C80.
[target.'cfg(unix)'.dependencies]
# M6-C155: read the soft open-file limit at startup; no unsafe code.
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
async-trait = "0.1.89"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http-body-util = "0.1"
rcgen = "0.13"
tokio = { version = "1.48", features = ["test-util"] }
# M6-C57: the provisioning gate's filesystem consumer opens the relay's 9P
# WebSocket, as tunnel-test-harness's does, with the version already locked.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
# M6-C57: the ACP profile is HTTP/2 only, so the gate's ACP consumer is too.
hyper = { version = "1.7", features = ["http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[lints]
workspace = true
